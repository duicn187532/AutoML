<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP: works under file:// (verified in M0). 'wasm-unsafe-eval' for WASM engines,
      blob: for inline workers and engine bootstrap scripts. No 'unsafe-eval', no remote hosts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>AutoML Workbench</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AutoML Workbench requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
